workflows:
  android-aar-workflow:
    name: Android Kotlin AAR Build
    max_build_duration: 60
    environment:
      vars: {}
    scripts:
      - name: Fix gradlew permissions
        script: chmod +x ./gradlew
      - name: Build AAR
        script: ./gradlew :SecureGuardSDK:assembleRelease
    artifacts:
      - SecureGuardSDK/build/outputs/aar/*.aar
